name: Validate Myth Network

on:
  push:
    branches: [ master, 'v3/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data and interaction logic
        run: npm run check

      - name: Validate v3 module syntax
        run: |
          node --check src/v3/config.js
          node --check src/v3/model.js
          node --check src/v3/state.js
          node --check src/v3/graph.js
          node --check src/v3/app.js
