name: Validate Myth Network

on:
  push:
    branches: [ master, 'v2/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data and core math
        run: npm run check

      - name: Validate v2 module syntax
        run: |
          node --check src/v2/config.js
          node --check src/v2/model.js
          node --check src/v2/router.js
          node --check src/v2/network.js
          node --check src/v2/atlas.js
          node --check src/v2/app.js
