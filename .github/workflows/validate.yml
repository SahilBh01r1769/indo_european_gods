name: Validate Myth Network

on:
  push:
    branches: [ master, 'v3/**', 'fix/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Validate data and interaction logic
        run: npm run check

      - name: Validate v3 module syntax
        run: |
          node --check src/v3/config.js
          node --check src/v3/model.js
          node --check src/v3/state.js
          node --check src/v3/graph-runtime.js
          node --check src/v3/graph-stable.js
          node --check src/v3/graph.js
          node --check src/v3/app.js

      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile journeys
        run: npm run test:e2e
